<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner Landing Page</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="Gradient">
    <div class="NavBar">
      <div class="NavElement">
        <img src="./img/crown.png" alt="crown" />
        <p>PRO</p>
      </div>
      <div class="NavElement"><img src="./img/bell.png" alt="bell" /></div>
    </div>

    <div class="Toggles">
      <div class="History">
        <img src="./img/clock.png" alt="clock" />
        <p>History</p>
      </div>
      <div class="Favorites">
        <img src="./img/heart.png" alt="heart" />
        <p>Favorites</p>
      </div>
    </div>

    <div class="YummyPicture">
      <img src="./img/chips.png" alt="chips" />
      <div class="Barcode"><img src="./img/barcode.png" alt="barcode" /></div>
    </div>

    <div class="InfoBox">
      <div class="Info">
        <h4>Your scan history is empty</h4>
        <p>Please scan your product or import it from your phones gallery.</p>
      </div>
    </div>
  </body>
</html>
