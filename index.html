<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner Landing Page</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="Gradient">
    <div class="NavBar">
      <div class="NavElement">
        <img src="./img/crown.png" alt="crown" />
        <p>PRO</p>
      </div>
      <div class="BellIcon"><img src="./img/bell.png" alt="bell" /></div>
    </div>

    <div class="Toggles">
      <div class="History">
        <img src="./img/clock.png" alt="clock" />
        <p>History</p>
      </div>
      <div class="Favorites">
        <img src="./img/heart.png" alt="heart" />
        <p>Favorites</p>
      </div>
    </div>

    <div class="YummyPicture">
      <img src="./img/chips.png" alt="chips" />
      <div class="Barcode"><img src="./img/barcode.png" alt="barcode" /></div>
    </div>

    <div class="InfoBox">
      <div class="Info">
        <h4>Your scan history is empty</h4>
        <p>Please scan the product or import it from your phone's gallery.</p>
      </div>

      <div class="ScanBox">
        <img src="./img/scan.png" alt="">
        <p>Scan Now</p>
      </div>
    </div>
          <div class="CardContainer">
            <div class="Card">
                <img src="./img/insurance.png" alt="">
                <h3>100% Safe</h3>
                <p>Data is secure</p>
            </div>
            <div class="Card">
                <img src="./img/leaf.png" alt="">
                <h3>Smart Analysis</h3>
                <p>AI-Powered insight</p>
            </div>
            <div class="Card">
                <img src="./img/flash.png" alt="">
                <h3>Quick & Easy</h3>
                <p>Scan in seconds</p>
            </div>
      </div>
  </body>
</html>
