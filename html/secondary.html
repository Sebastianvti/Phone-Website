<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secondary</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="gradient">
    <!-- Product Rating -->
     <div class="ProductContainer">
      <div class="ProductMain">
        <div class="ProductImageContainer">
          <div class="ProductImage">
            <img src="../img/chips.png" alt="chips" />
          </div>
        </div>
        <div class="ProductInfoContainer">
          <div class="ProductTitle">
            <p>Ways Chips With Paprika</p>
          </div>
          <div class="ProductRatingMain">
            <div class="ProductRating">
              <p>16/100</p>
            </div>
            <p>Bad</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Product Display -->
    <div class="YummyPicture">
      <img src="../img/chips.png" alt="chips" />
      <div class="Barcode"><img src="../img/barcode.png" alt="barcode" /></div>
    </div>

    <!-- Infobox -->
    <div class="InfoBox">
      <div class="Info">
        <h4>Scan Any Product You Want</h4>
        <p>Join 1M+ users who already analyze food labels with ease.</p>
      </div>
      
      <!-- Scanner -->
      <div class="ScanBox">
        <img src="../img/scan.png" alt="" />
        <p>Scan Product</p>
      </div>
    </div>
    
</body>
</html>
